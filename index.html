<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tabú en Español</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <h1>Tabú en Español</h1>

    <div id="card" class="card hidden">
      <div class="word" id="word"></div>
      <ul class="taboo" id="taboo"></ul>
    </div>

    <p id="message" class="message">Pulsa el botón para sacar una carta.</p>

    <button id="next">Nueva carta</button>
    <p id="counter" class="counter"></p>
  </main>

  <script src="cards.js"></script>
  <script src="app.js"></script>
</body>
</html>
